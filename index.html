<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АвитоБизнес — Симулятор Перекупа</title>
  <style>
    :root {
      --bg: #0c0e14;
      --bg-elevated: #12151f;
      --card-bg: #171b26;
      --card-hover: #1c2230;
      --input-bg: #1a1f2e;
      --primary: #3b9eff;
      --primary-dim: rgba(59, 158, 255, 0.15);
      --text: #f0f2f5;
      --text-muted: #8b93a7;
      --accent-green: #22c55e;
      --accent-green-dim: rgba(34, 197, 94, 0.15);
      --accent-red: #ef4444;
      --accent-orange: #f59e0b;
      --border: rgba(255, 255, 255, 0.06);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 32px;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 158, 255, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(34, 197, 94, 0.06), transparent);
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(12, 14, 20, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #5eb3ff, #3b9eff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .balance-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-dim);
      border: 1px solid rgba(59, 158, 255, 0.25);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .balance-value { color: #7ec8ff; font-weight: 800; font-size: 14px; }
    .btn-reset {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-reset:hover { background: rgba(239, 68, 68, 0.22); }

    .container { max-width: 560px; margin: 0 auto; padding: 16px; }

    /* SEARCH */
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-wrap::before {
      content: '🔍';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.6;
      pointer-events: none;
    }
    .search-box {
      width: 100%;
      padding: 13px 16px 13px 40px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus {
      border-color: rgba(59, 158, 255, 0.45);
      box-shadow: 0 0 0 3px var(--primary-dim);
    }
    .search-box::placeholder { color: #5a6278; }

    /* CATEGORIES */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn:hover { border-color: rgba(255,255,255,0.12); color: var(--text); }
    .cat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(59, 158, 255, 0.35);
    }

    /* TABS */
    .bottom-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 5px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .nav-tab {
      flex: 1;
      padding: 11px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active {
      background: var(--primary-dim);
      color: var(--primary);
    }

    /* CARDS */
    .grid { display: flex; flex-direction: column; gap: 10px; }
    .item-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      gap: 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      position: relative;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      animation: cardIn 0.35s ease-out;
    }
    .item-card:hover {
      background: var(--card-hover);
      border-color: rgba(59, 158, 255, 0.2);
      transform: translateY(-2px);
    }
    .item-card:active { transform: scale(0.98); }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .item-card img {
      width: 96px;
      height: 88px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: #0f1219;
      flex-shrink: 0;
    }
    .item-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      min-width: 0;
      gap: 3px;
    }
    .item-cat {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .item-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-price {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      margin-top: 2px;
    }
    .item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }
    .item-market {
      font-size: 12px;
      color: var(--text-muted);
    }
    .profit-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-green-dim);
      color: var(--accent-green);
    }
    .badge-offer {
      position: absolute;
      top: 10px;
      right: 10px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .empty-state span { font-size: 40px; display: block; margin-bottom: 12px; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .preview-modal {
      background: var(--bg-elevated);
      width: 100%;
      max-width: 500px;
      max-height: 92vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      padding: 12px 20px 24px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-bottom: none;
      box-shadow: var(--shadow);
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-handle {
      width: 40px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      margin: 4px auto 16px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 14px;
      line-height: 1.3;
      letter-spacing: -0.3px;
    }
    .preview-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-bottom: 14px;
      background: #0f1219;
    }
    .preview-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .price-main { font-size: 20px; font-weight: 800; }
    .price-market { font-size: 13px; color: var(--text-muted); font-weight: 500; display: block; margin-top: 4px; }

    .chat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .chat-box-area {
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      padding: 14px;
      min-height: 110px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
      max-width: 88%;
      word-break: break-word;
      line-height: 1.4;
    }
    .msg.seller {
      background: #222836;
      color: #e8eaef;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.player {
      background: linear-gradient(135deg, #3b9eff, #2563eb);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .btn-modal {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
    }
    .btn-modal:hover { filter: brightness(1.08); }
    .btn-modal:active { transform: scale(0.98); }
    .btn-bargain {
      background: linear-gradient(135deg, #3b9eff, #2563eb);
      box-shadow: 0 4px 14px rgba(59, 158, 255, 0.3);
    }
    .btn-buy {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
    }
    .btn-sell {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
    }
    .btn-close {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-close:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  </style>
</head>
<body>

  <header>
    <h1>АвитоБизнес</h1>
    <div class="header-right">
      <div class="balance-tag">Баланс: <span class="balance-value" id="balance">10 000</span> ₽</div>
      <button class="btn-reset" onclick="resetGame()">Сброс</button>
    </div>
  </header>

  <div class="container">
    <div class="search-wrap">
      <input type="text" class="search-box" id="search-input" placeholder="Поиск по объявлениям..." oninput="render()">
    </div>

    <div class="categories">
      <button class="cat-btn active" onclick="filterCategory('Все', this)">Все</button>
      <button class="cat-btn" onclick="filterCategory('Электроника', this)">Электроника</button>
      <button class="cat-btn" onclick="filterCategory('Авто', this)">Авто</button>
      <button class="cat-btn" onclick="filterCategory('Одежда', this)">Одежда</button>
      <button class="cat-btn" onclick="filterCategory('Дом и Уют', this)">Дом и Уют</button>
    </div>

    <div class="bottom-nav">
      <div class="nav-tab active" id="tab-m" onclick="switchTab('market')">🛒 Рынок · <span id="count-market">0</span></div>
      <div class="nav-tab" id="tab-i" onclick="switchTab('my_sales')">📢 Мои · <span id="count-sales">0</span></div>
    </div>

    <div class="grid" id="items-list"></div>
  </div>

  <div class="modal-overlay" id="preview-modal" onclick="if(event.target===this)closeModal()">
    <div class="preview-modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="m-title">--</div>
      <img id="m-img" src="" class="preview-img" alt="">
      <div class="preview-desc" id="m-desc">--</div>

      <div class="price-row">
        <div>
          <div class="price-main"><span id="m-price">0</span> ₽</div>
          <span class="price-market" id="m-market-wrap">Рыночная: ~<span id="m-market">0</span> ₽</span>
        </div>
      </div>

      <div class="chat-label">Чат с продавцом</div>
      <div class="chat-box-area" id="chat-box"></div>
      <div class="modal-actions" id="m-actions"></div>
    </div>
  </div>

    const descVariants = [
      'Срочно! Полный комплект, чек остался.',
      'Лежал без дела, продаю за ненадобностью.',
      'Есть коцки, но на работу вообще не влияют.',
      'Отличное состояние, без торга.',
      'Покупался полгода назад, всё работает идеально.',
      'Торг уместен при осмотре.',
      'Отдам сегодня, могу встретиться в центре.',
      'Почти не пользовался, как новый.',
      'Причина продажи — переезд.',
      'Все вопросы в сообщениях.'
    ];

    const conditionTags = [
      '', ' (б/у)', ' (идеал)', ' (с чеком)', ' (гарантия)', ' (срочная продажа)',
      ' (торг)', ' (самовывоз)', ' (как новый)', ' (рабочий)'
    ];

    let state = {
      balance: 10000,
      selectedCategory: 'Все',
      currentTab: 'market',
      market: [],
      mySales: []
    };

    let activeItemId = null;
    let usedTitleKeys = new Set();

    function uid() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }

    function saveGame() {
      localStorage.setItem('avito_biz_state_v2', JSON.stringify(state));
    }

    function loadGame() {
      const saved = localStorage.getItem('avito_biz_state_v2');
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          state.market = [];
          state.mySales = [];
        }
        usedTitleKeys = new Set(state.market.map(i => i.uniqueKey).filter(Boolean));
        while (state.market.length < 100) {
          generateNewMarketItem();
        }
      } else {
        for (let i = 0; i < 100; i++) {
          generateNewMarketItem();
        }
      }
      render();
      scheduleNextListing();
    }

    function resetGame() {
      if (confirm('Сбросить весь прогресс?')) {
        localStorage.removeItem('avito_biz_state_v2');
        localStorage.removeItem('avito_biz_state');
        location.reload();
      }
    }

    function pickUniqueTemplate() {
      const categories = Object.keys(templates);
      // Собираем все возможные ключи
      const allOptions = [];
      categories.forEach(cat => {
        templates[cat].forEach((t, idx) => {
          conditionTags.forEach((tag, tIdx) => {
            const key = cat + '|' + t.title + '|' + tIdx;
            if (!usedTitleKeys.has(key)) {
              allOptions.push({ cat, template: t, tag, key });
            }
          });
        });
      });

      if (allOptions.length === 0) {
        // Все комбинации заняты — сбрасываем учёт и начинаем заново
        usedTitleKeys.clear();
        return pickUniqueTemplate();
      }

      const pick = allOptions[Math.floor(Math.random() * allOptions.length)];
      usedTitleKeys.add(pick.key);
      return pick;
    }

    function generateNewMarketItem() {
      // Максимум 100 объявлений на рынке
      if (state.market.length >= 100) return;

      const pick = pickUniqueTemplate();
      const template = pick.template;
      const cat = pick.cat;

      const realMarketPrice = Math.round((template.minP + Math.random() * (template.maxP - template.minP)) / 100) * 100;
      const discount = 0.6 + Math.random() * 0.28;
      const price = Math.round((realMarketPrice * discount) / 100) * 100;

      const newItem = {
        id: uid(),
        uniqueKey: pick.key,
        title: template.title + pick.tag,
        cat: cat,
        price: Math.max(100, price),
        market: realMarketPrice,
        desc: descVariants[Math.floor(Math.random() * descVariants.length)],
        img: template.img,
        bargainRefused: false,
        chat: [{ sender: 'seller', text: 'Здравствуйте! Продаю срочно. Пишите, если интересно.' }]
      };

      state.market.unshift(newItem);
      saveGame();
      render();
    }

    // Новые объявления каждые 5–10 сек, только если на рынке меньше 100
    function scheduleNextListing() {
      const delay = 5000 + Math.floor(Math.random() * 5001); // 5000..10000
      setTimeout(() => {
        if (state.market.length < 100) {
          generateNewMarketItem();
        }
        scheduleNextListing();
      }, delay);
    }

    // Авто-покупатели для выложенных товаров
    setInterval(() => {
      let updated = false;
      state.mySales.forEach(item => {
        if (!item.buyerOffer) {
          if (Math.random() < 0.45) {
            const isDiscountOffer = Math.random() < 0.6;
            const offerPrice = isDiscountOffer
              ? Math.round((item.myPrice * 0.8) / 100) * 100
              : item.myPrice;
            item.buyerOffer = {
              price: offerPrice,
              msg: isDiscountOffer
                ? `Здравствуйте! Заберу прямо сегодня за ${offerPrice.toLocaleString()} ₽, уступите?`
                : `Здравствуйте! Готов купить за вашу цену (${offerPrice.toLocaleString()} ₽). Где встретимся?`
            };
            updated = true;
          }
        }
      });
      if (updated) {
        saveGame();
        render();
      }
    }, 4000);

    function filterCategory(cat, btn) {
      state.selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function switchTab(tab) {
      state.currentTab = tab;
      document.getElementById('tab-m').classList.toggle('active', tab === 'market');
      document.getElementById('tab-i').classList.toggle('active', tab === 'my_sales');
      render();
    }

    function render() {
      document.getElementById('balance').innerText = state.balance.toLocaleString();
      document.getElementById('count-market').innerText = state.market.length;
      document.getElementById('count-sales').innerText = state.mySales.length;

      const list = document.getElementById('items-list');
      const search = document.getElementById('search-input').value.toLowerCase();
      list.innerHTML = '';

      const itemsArr = state.currentTab === 'market' ? state.market : state.mySales;
      let shown = 0;

      itemsArr.forEach(item => {
        if ((state.selectedCategory === 'Все' || item.cat === state.selectedCategory) &&
            item.title.toLowerCase().includes(search)) {

          shown++;
          const card = document.createElement('div');
          card.className = 'item-card';
          card.onclick = () => openModal(item.id);

          const hasOfferBadge = state.currentTab === 'my_sales' && item.buyerOffer;
          const price = state.currentTab === 'market' ? item.price : item.myPrice;

          let metaHtml = '';
          if (state.currentTab === 'market') {
            const profit = item.market - item.price;
            const pct = item.price > 0 ? Math.round((profit / item.price) * 100) : 0;
            metaHtml = `
              <div class="item-meta">
                <span class="item-market">Рынок ~${item.market.toLocaleString()} ₽</span>
                ${profit > 0 ? `<span class="profit-badge">+${pct}%</span>` : ''}
              </div>`;
          } else {
            metaHtml = `<div class="item-meta"><span class="item-market">Куплено за ${(item.buyPrice || 0).toLocaleString()} ₽</span></div>`;
          }

          card.innerHTML = `
            ${hasOfferBadge ? '<div class="badge-offer">💬 Оффер</div>' : ''}
            <img src="${item.img}" alt="" loading="lazy">
            <div class="item-info">
              <div class="item-cat">${item.cat || ''}</div>
              <div class="item-title">${item.title}</div>
              <div class="item-price">${price.toLocaleString()} ₽</div>
              ${metaHtml}
            </div>
          `;
          list.appendChild(card);
        }
      });

      if (shown === 0) {
        list.innerHTML = `<div class="empty-state"><span>📭</span>Ничего не найдено</div>`;
      }
    }

    function openModal(id) {
      activeItemId = id;
      const isMarket = state.currentTab === 'market';
      const item = (isMarket ? state.market : state.mySales).find(i => i.id === id);
      if (!item) return;

      document.getElementById('m-title').innerText = item.title;
      document.getElementById('m-img').src = item.img;
      document.getElementById('m-desc').innerText = item.desc;
      document.getElementById('m-price').innerText = (isMarket ? item.price : item.myPrice).toLocaleString();

      const marketWrap = document.getElementById('m-market-wrap');
      if (isMarket) {
        marketWrap.style.display = 'block';
        document.getElementById('m-market').innerText = item.market.toLocaleString();
      } else {
        marketWrap.style.display = 'none';
      }

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (isMarket) {
        item.chat.forEach(msg => {
          chatBox.innerHTML += `<div class="msg ${msg.sender}">${msg.text}</div>`;
        });
      } else {
        if (item.buyerOffer) {
          chatBox.innerHTML = `<div class="msg seller">${item.buyerOffer.msg}</div>`;
        } else {
          chatBox.innerHTML = `<div class="msg seller" style="color:#777;">Пока нет сообщений от покупателей. Подождите немного...</div>`;
        }
      }

      const actions = document.getElementById('m-actions');
      actions.innerHTML = '';

      if (isMarket) {
        // Кнопка торга −25% только если продавец ещё не отказал
        if (!item.bargainRefused) {
          actions.innerHTML += `<button class="btn-modal btn-bargain" onclick="tryBargain('${item.id}')">📉 Скиньте 25%?</button>`;
        }
        actions.innerHTML += `<button class="btn-modal btn-buy" onclick="buyItem('${item.id}')">🛒 Купить за ${item.price.toLocaleString()} ₽</button>`;
      } else {
        if (item.buyerOffer) {
          actions.innerHTML += `<button class="btn-modal btn-sell" onclick="acceptOffer('${item.id}')">🤝 Продать за ${item.buyerOffer.price.toLocaleString()} ₽</button>`;
          actions.innerHTML += `<button class="btn-modal btn-close" onclick="rejectOffer('${item.id}')">❌ Отклонить предложение</button>`;
        }
      }

      actions.innerHTML += `<button class="btn-modal btn-close" onclick="closeModal()">Закрыть</button>`;
      document.getElementById('preview-modal').classList.add('active');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function closeModal() {
      document.getElementById('preview-modal').classList.remove('active');
    }

    // Торг: просим −25%, шанс согласия 50%. При отказе кнопка больше не показывается.
    function tryBargain(id) {
      const item = state.market.find(i => i.id === id);
      if (!item || item.bargainRefused) return;

      item.chat.push({ sender: 'player', text: 'Можете скинуть 25%? Заберу сегодня.' });

      if (Math.random() < 0.5) {
        // Согласился
        item.price = Math.max(100, Math.round((item.price * 0.75) / 100) * 100);
        item.chat.push({
          sender: 'seller',
          text: `Хорошо, уговорил! Отдам за ${item.price.toLocaleString()} ₽.`
        });
        // После успешного торга повторно торговаться нельзя
        item.bargainRefused = true;
      } else {
        // Отказ — кнопка пропадает
        item.bargainRefused = true;
        item.chat.push({
          sender: 'seller',
          text: 'Извините, 25% — это слишком. Цена окончательная, без торга.'
        });
      }

      saveGame();
      openModal(id);
      render();
    }

    function buyItem(id) {
      const idx = state.market.findIndex(i => i.id === id);
      if (idx === -1) return;
      const item = state.market[idx];

      if (state.balance < item.price) {
        alert('Недостаточно денег на балансе!');
        return;
      }

      state.balance -= item.price;

      state.mySales.push({
        ...item,
        buyPrice: item.price,
        myPrice: item.market,
        buyerOffer: null
      });

      state.market.splice(idx, 1);

      saveGame();
      closeModal();
      render();
      alert('Вы успешно купили товар! Он выставлен в раздел «Мои объявления».');
    }

    function acceptOffer(id) {
      const idx = state.mySales.findIndex(i => i.id === id);
      const item = state.mySales[idx];

      if (!item || !item.buyerOffer) return;

      const salePrice = item.buyerOffer.price;
      state.balance += salePrice;

      state.mySales.splice(idx, 1);

      saveGame();
      closeModal();
      render();
      alert(`🎉 Поздравляем! Вы успешно продали ${item.title} за ${salePrice.toLocaleString()} ₽!`);
    }

    function rejectOffer(id) {
      const item = state.mySales.find(i => i.id === id);
      if (item) {
        item.buyerOffer = null;
        saveGame();
        openModal(id);
        render();
      }
    }

    loadGame();
  </script>
</body>
</html>
