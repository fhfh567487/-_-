<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авито Перекуп</title>
  <style>
    :root {
      --primary: #00aaff;
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --text: #222222;
      --accent: #ff5252;
      --success: #2e7d32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; }
    
    header { background-color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e0e0e0; position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 20px; color: var(--primary); }
    .stats { display: flex; gap: 15px; align-items: center; font-weight: bold; }
    .btn-reset { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; }
    
    .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; text-align: center; }
    .tab-btn.active { border-bottom-color: var(--primary); color: var(--primary); }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 10px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
    .card { background: var(--card-bg); border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .card h3 { font-size: 16px; margin-bottom: 5px; }
    .card .price { font-size: 18px; font-weight: bold; color: var(--success); margin-bottom: 5px; }
    .card .meta { font-size: 12px; color: #666; margin-bottom: 10px; }

    button.action-btn { width: 100%; padding: 8px; border: none; background: var(--primary); color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 5px; }
    button.action-btn:disabled { background: #ccc; cursor: not-allowed; }
    button.secondary-btn { background: #6c757d; }
    button.success-btn { background: var(--success); }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; width: 90%; }
  </style>
</head>
<body>

  <header>
    <h1>💼 Авито Перекуп</h1>
    <div class="stats">
      <span>💰 <span id="balance">15000</span> ₽</span>
      <button class="btn-reset" onclick="resetGame()">Сбросить прогресс</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('market')">🛒 Объявления рынка</button>
    <button class="tab-btn" onclick="switchTab('inventory')">🎒 Мои товары / Продажа</button>
  </div>

  <div class="container">
    <div id="tab-market" class="tab-content">
      <div class="grid" id="market-list"></div>
    </div>

    <div id="tab-inventory" class="tab-content" style="display:none;">
      <div class="grid" id="inventory-list"></div>
    </div>
  </div>

  <div class="modal" id="chat-modal">
    <div class="modal-content">
      <h3 id="modal-title">Сообщение</h3>
      <br>
      <p id="modal-text">Текст предложения...</p>
      <br>
      <button class="action-btn success-btn" id="modal-accept">Согласиться</button>
      <button class="action-btn secondary-btn" style="margin-top:5px;" onclick="closeModal()">Отклонить</button>
    </div>
  </div>

  <script>
    let state = {
      balance: 15000,
      inventory: [],
      market: []
    };

    const itemNames = [
      'iPhone 11 64GB', 'Видеокарта GTX 1060', 'Кроссовки Nike Air', 'Часы Rolex',
      'ВАЗ 2107 б/у', 'Виниловый проигрыватель', 'PlayStation 4 Pro', 'Ноутбук ASUS',
      'Палатка 3-местная', 'Электросамокат', 'Дрель Bosch', 'Телевизор Samsung 43"'
    ];

    const images = [
      'https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?w=300',
      'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=300',
      'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300',
      'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300',
      'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=300'
    ];

    function saveGame() {
      localStorage.setItem('avito_simple_save', JSON.stringify(state));
    }

    function loadGame() {
      const saved = localStorage.getItem('avito_simple_save');
      if (saved) {
        state = JSON.parse(saved);
      } else {
        generateMarket();
      }
      render();
    }

    function resetGame() {
      if (confirm('Сбросить весь прогресс?')) {
        localStorage.removeItem('avito_simple_save');
        location.reload();
      }
    }

    function generateMarket() {
      state.market = [];
      for (let i = 0; i < 20; i++) {
        const name = itemNames[Math.floor(Math.random() * itemNames.length)];
        const img = images[Math.floor(Math.random() * images.length)];
        const basePrice = Math.floor(Math.random() * 20 + 3) * 1000;
        
        state.market.push({
          id: Date.now() + Math.random(),
          name: name,
          img: img,
          price: basePrice,
          marketValue: Math.round(basePrice * 1.3),
          bargainRefused: false
        });
      }
    }

    function render() {
      document.getElementById('balance').innerText = state.balance.toLocaleString();
      renderMarket();
      renderInventory();
    }

    function renderMarket() {
      const list = document.getElementById('market-list');
      list.innerHTML = '';

      state.market.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.img}">
          <h3>${item.name}</h3>
          <div class="price">${item.price.toLocaleString()} ₽</div>
          <div class="meta">Рыночная цена: ~${item.marketValue.toLocaleString()} ₽</div>
          ${!item.bargainRefused ? `<button class="action-btn secondary-btn" onclick="tryBargain(${item.id})">📉 Торговаться (-15%)</button>` : ''}
          <button class="action-btn" onclick="buyItem(${item.id})">Купить</button>
        `;
        list.appendChild(card);
      });
    }

    function renderInventory() {
      const list = document.getElementById('inventory-list');
      list.innerHTML = '';

      state.inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.img}">
          <h3>${item.name}</h3>
          <div class="price">Куплено за: ${item.buyPrice.toLocaleString()} ₽</div>
          <div class="meta">Статус: ${item.onSale ? '💬 В продаже...' : '📦 На складе'}</div>
          ${!item.onSale ? `<button class="action-btn success-btn" onclick="putOnSale(${item.id})">Выставить на продажу</button>` : ''}
        `;
        list.appendChild(card);
      });
    }

    function tryBargain(id) {
      const item = state.market.find(i => i.id === id);
      if (!item) return;

      if (Math.random() < 0.5) {
        item.price = Math.round(item.price * 0.85);
        alert('Продавец согласился скинуть цену!');
      } else {
        item.bargainRefused = true;
        alert('Продавец отказался от скидки!');
      }
      saveGame();
      render();
    }

    function buyItem(id) {
      const idx = state.market.findIndex(i => i.id === id);
      const item = state.market[idx];

      if (state.balance < item.price) {
        alert('Недостаточно денег!');
        return;
      }

      state.balance -= item.price;
      state.inventory.push({
        ...item,
        buyPrice: item.price,
        onSale: false,
        offer: null
      });

      state.market.splice(idx, 1);
      saveGame();
      render();
    }

    function putOnSale(id) {
      const item = state.inventory.find(i => i.id === id);
      if (item) {
        item.onSale = true;
        saveGame();
        render();
      }
    }

    function showModal(title, text, onAccept) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-text').innerText = text;
      document.getElementById('chat-modal').classList.add('active');
      document.getElementById('modal-accept').onclick = onAccept;
    }

    function closeModal() {
      document.getElementById('chat-modal').classList.remove('active');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      event.target.classList.add('active');
      document.getElementById('tab-' + tab).style.display = 'block';
    }

    // --- ТАЙМЕР ВХОДЯЩИХ ПРЕДЛОЖЕНИЙ ---
    setInterval(() => {
      let changed = false;

      state.inventory.forEach(item => {
        if (item.onSale && !item.hasPendingOffer) {
          if (Math.random() < 0.4) {
            item.hasPendingOffer = true;
            changed = true;

            const isCrazyOffer = Math.random() < 0.25;
            if (isCrazyOffer) {
              showModal("💬 Входящий диалог", `Здравствуйте! Предлагаю обмен товара "${item.name}" на 2 мешка картошки и бензопилу. Согласны?`, () => {
                alert("Вы отказались от предложения.");
                item.hasPendingOffer = false;
                closeModal();
                saveGame();
                render();
              });
            } else {
              const offerPrice = Math.round(item.marketValue * (0.85 + Math.random() * 0.3));
              showModal("💬 Новое предложение!", `Покупатель хочет купить "${item.name}" за ${offerPrice.toLocaleString()} ₽. Продать?`, () => {
                state.balance += offerPrice;
                state.inventory = state.inventory.filter(i => i.id !== item.id);
                closeModal();
                saveGame();
                render();
              });
            }
          }
        }
      });

      if (state.market.length < 8) {
        generateMarket();
        changed = true;
      }

      if (changed) {
        saveGame();
        render();
      }
    }, 4000);

    loadGame();
  </script>
</body>
</html>
